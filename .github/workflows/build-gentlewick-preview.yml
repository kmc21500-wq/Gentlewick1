name: Build updated Gentlewick preview

on:
  push:
    branches: [remove-backup-cloud-sync]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove-backup-cloud-sync
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Remove stale prebuilt output
        run: rm -rf .vercel/output

      - name: Build the current source
        run: npm run build

      - name: Typecheck generated route tree
        run: npm run typecheck

      - name: Commit fresh deployment output
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .vercel/output src/routeTree.gen.ts package-lock.json
          if git diff --cached --quiet; then
            echo "No generated output changes."
            exit 0
          fi
          git commit -m "Build updated Gentlewick preview artifacts"
          git push origin HEAD:remove-backup-cloud-sync
