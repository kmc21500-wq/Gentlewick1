name: Deploy Gentlewick source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract source archive
        run: |
          set -euo pipefail
          archive="Gentlewick-v19-final-prepared.zip"
          test -f "$archive"
          temp="$(mktemp -d)"
          unzip -q "$archive" -d "$temp"
          rsync -a --exclude='attachments/' "$temp/" "$GITHUB_WORKSPACE/"
          rm -rf "$temp"
          rm -f "$archive" "Gentlewick 2.html" "DEPLOY_TRIGGER"
          rm -f index.html

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and repair lockfile
        run: npm install --no-audit --no-fund

      - name: Audit
        run: npm run launch:audit

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Commit and push prepared source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Prepare Gentlewick v19 production source"
          git push origin HEAD:main
