name: Deploy Gentlewick source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract source archive
        run: |
          set -euo pipefail
          archive="Gentlewick-v19-final-prepared.zip"
          test -f "$archive"
          temp="$(mktemp -d)"
          unzip -q "$archive" -d "$temp"
          echo "Archive files:"
          find "$temp" -maxdepth 3 -type f | head -40
          package_json="$(find "$temp" -maxdepth 6 -type f -name package.json -print -quit)"
          if [[ -z "$package_json" ]]; then
            echo "Could not locate package.json in archive."
            exit 1
          fi
          project_dir="$(dirname "$package_json")"
          rsync -a --exclude='attachments/' "$project_dir/" "$GITHUB_WORKSPACE/"
          rm -rf "$temp"
          rm -f "$archive" "Gentlewick 2.html" "DEPLOY_TRIGGER" "DEPLOY_TRIGGER2" "DEPLOY_TRIGGER3"
          rm -f index.html
          echo "Extracted project from $project_dir"
          ls -la scripts src

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and repair lockfile
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Commit and push prepared source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Prepare Gentlewick v19 production source"
          git push origin HEAD:main
