name: Prepare and deploy Gentlewick v19

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prepare-gentlewick.yml"
      - "Gentlewick-v19-final-prepared.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract latest prepared project
        run: |
          set -euo pipefail
          archive="Gentlewick-v19-final-prepared.zip"
          test -f "$archive"
          temp="$(mktemp -d)"
          unzip -q "$archive" -d "$temp"
          rsync -a --exclude='attachments/' "$temp/" "$GITHUB_WORKSPACE/"
          rm -rf "$temp"
          rm -f "$archive" "Gentlewick 2.html"
          rm -f index.html

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and repair lockfile
        run: npm install --no-audit --no-fund

      - name: Run launch audit
        run: npm run launch:audit

      - name: Typecheck
        run: npm run typecheck

      - name: Build production app
        run: npm run build

      - name: Commit prepared source to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Prepare Gentlewick v19 production source"
          git push origin HEAD:main
