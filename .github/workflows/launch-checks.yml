name: Gentlewick launch checks

on:
  pull_request:
    branches:
      - feature/supabase-memorials
  push:
    branches:
      - launch-completion-2026-11-22
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gentlewick-launch-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Launch audit
        run: npm run launch:audit
      - name: Smoke tests
        run: npm run test:smoke
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
